name: maskwire-demo

services:
  maskwire:
    build:
      context: .
      target: maskwire
    image: maskwire:dev
    environment:
      MASKWIRE_CONFIG: /etc/maskwire/maskwire.yaml
      MASKWIRE_KEYS__MASTER_KEY: fef77acd0ca38774fb10a35370957851f6241697aa0ca8f174c33b1152314c2a
      MASKWIRE_TRACING__ENDPOINT: ${MASKWIRE_TRACING_ENDPOINT:-}
    volumes:
      - ./deploy/maskwire.yaml:/etc/maskwire/maskwire.yaml:ro
      - audit:/var/lib/maskwire/audit
    ports:
      - "${MASKWIRE_PORT:-8090}:8090"
      - "${MASKWIRE_ADMIN_PORT:-9091}:9090"
    depends_on:
      scg:
        condition: service_started
      mockllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/maskwire", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  scg:
    build:
      context: ../semantic-cache-gateway
      dockerfile: ../maskwire/deploy/scg/Dockerfile
    image: semantic-cache-gateway:demo-patched
    command: ["/app/gateway", "--config", "/app/config.yaml"]
    volumes:
      - ../semantic-cache-gateway/config.example.yaml:/app/config.yaml:ro
    environment:
      SCG_LLM_PROVIDER: openai
      SCG_LLM_BASE_URL: http://mockllm:9000/v1
      SCG_LLM_API_KEY: mock
      SCG_EMBEDDER_BASE_URL: http://mockllm:9000/v1
      SCG_EMBEDDER_API_KEY: mock
      SCG_VECTOR_DB_PROVIDER: redis-stack
      SCG_VECTOR_DB_REDIS_ADDR: redis:6379
      SCG_SERVER_RATE_LIMIT_RPS: "200"
      SCG_SERVER_RATE_LIMIT_BURST: "400"
    ports:
      - "${SCG_PORT:-18080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      mockllm:
        condition: service_healthy

  mockllm:
    build:
      context: .
      target: mockllm
    image: mockllm:dev
    command: ["-addr", ":9000", "-chunk-min", "1", "-chunk-max", "7", "-chunk-delay", "5ms"]
    ports:
      - "${MOCKLLM_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/mockllm", "-healthcheck", "http://127.0.0.1:9000/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  demo:
    profiles: ["demo"]
    build:
      context: .
      target: demo
    image: maskwire-demo-client:dev
    command: ["-proxy", "http://maskwire:8090", "-mock", "http://mockllm:9000"]
    depends_on:
      maskwire:
        condition: service_healthy

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9092}:9090"
    depends_on:
      - maskwire

  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "${JAEGER_PORT:-16686}:16686"

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/maskwire.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  audit:
