name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, check-latest: true }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.15.0 }
      - run: go run ./internal/tools/nocomments
      - run: go mod tidy -diff
      - run: go tool -modfile=tools/go.mod govulncheck ./...
  docs:
    name: generated docs
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go run ./internal/tools/configdoc -check
      - run: go run ./internal/tools/evalreport -check
      - name: Detection quality summary
        run: sed -n '/## min_score 0.0/,/## min_score 0.7/p' docs/evaluation.md >> "$GITHUB_STEP_SUMMARY"
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      MASKWIRE_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, check-latest: true }
      - run: go test -race -shuffle=on -count=1 -covermode=atomic -coverpkg=./internal/...,./pkg/... -coverprofile=cover.out ./...
      - run: go run ./internal/tools/covergate -profile cover.out -min 80 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: cover.out }
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: coverage }
      - run: go run ./internal/tools/covbadge -profile cover.out -out "$RUNNER_TEMP/coverage.json"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git switch badges
          else
            git switch --orphan badges
            git rm -rf --quiet . || true
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet || git commit -m "ci: update coverage badge"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/restore, fn: FuzzRestoreSplit }
          - { pkg: ./internal/restore, fn: FuzzMatcher }
          - { pkg: ./internal/detect, fn: FuzzDetect }
          - { pkg: ./internal/detect, fn: FuzzNames }
          - { pkg: ./internal/mask, fn: FuzzMaskRoundTrip }
          - { pkg: ./internal/codec/openai, fn: FuzzMaskRequest }
          - { pkg: ./internal/sse, fn: FuzzReader }
          - { pkg: ./internal/jsonx, fn: FuzzRewriteIdentity }
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go test -run='^$' -fuzz='^${{ matrix.target.fn }}$' -fuzztime=45s ${{ matrix.target.pkg }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target.fn }}
          path: "**/testdata/fuzz/${{ matrix.target.fn }}/"
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make build
      - run: ./bin/maskwire --version
      - run: go test -run='^$' -bench=. -benchmem -benchtime=200ms ./internal/... | tee -a "$GITHUB_STEP_SUMMARY"
  compose:
    name: end-to-end demo
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guilherme-Ciano/semantic-cache-gateway
          path: semantic-cache-gateway
          persist-credentials: false
      - run: mv semantic-cache-gateway ../semantic-cache-gateway
      - run: docker compose up --build -d --wait
      - name: Run the demo client
        run: docker compose --profile demo run --rm --build demo | tee demo.txt
      - name: Assert no raw value reached the upstream
        run: |
          if grep '^upstream saw' demo.txt | grep -E 'ana\.souza|bruno\.lima|529\.982\.247-25|111\.444\.777-35|PT50 0002'; then
            echo "::error::raw personal data reached the upstream"
            exit 1
          fi
          grep -q 'status         : 422' demo.txt
          test "$(grep -c '^status         : 200' demo.txt)" -eq 5
      - name: Verify the audit chain
        run: docker compose exec -T maskwire /usr/local/bin/maskwire audit verify --dir /var/lib/maskwire/audit | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker compose logs --no-color | tail -200
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target maskwire .
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target mockllm .
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target demo .
