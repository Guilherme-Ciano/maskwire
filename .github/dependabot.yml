version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { gomod: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /tools
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /bench
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
