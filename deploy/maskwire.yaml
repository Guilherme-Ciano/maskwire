server:
  addr: ":8090"
  admin_addr: ":9090"
  shutdown_drain_delay: 1s
keys:
  version: 1
audit:
  enabled: true
  dir: /var/lib/maskwire/audit
  on_full: block
log:
  level: info
  format: json
routes:
  - name: openai-via-cache
    path: /v1/chat/completions
    upstream: http://scg:8080
    codec: openai
    synthesize_stream: true
  - name: openai-direct
    path: /direct/v1/chat/completions
    upstream: http://mockllm:9000/v1/chat/completions
    codec: openai
  - name: anthropic-direct
    path: /v1/messages
    upstream: http://mockllm:9000
    codec: anthropic
  - name: anthropic-count-tokens
    path: /v1/messages/count_tokens
    upstream: http://mockllm:9000
    codec: anthropic
  - name: openai-responses
    path: /v1/responses
    upstream: http://mockllm:9000
    codec: openai-responses
  - name: openai-embeddings
    path: /v1/embeddings
    upstream: http://mockllm:9000
    codec: openai-embeddings
  - name: models
    path: /v1/models
    upstream: http://mockllm:9000
    codec: passthrough
tenants:
  - id: demo
    key_sha256: ce104b0fe84d8767b5eadecfce7a9eeb1b0022dd26a3f45087e3c0b1f31aed87
    mode: enforce
    default: mask
    foreign_token: generic
    by_type:
      CREDIT_CARD:
        action: block
  - id: globex
    key_sha256: 79312c08c8432501ead35082d96b572576b2a6ff3fd736c451128f02726bd748
    mode: observe
